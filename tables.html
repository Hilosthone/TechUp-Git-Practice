<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <!--Tables in HTML
    Important tables tags:
    <table>, <tr>>, <th>, <td>
    -->

    <table border="1">
        <tr>
            <th>No.</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Samuel</td>
            <td>12</td>
            <td>Frontend</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Soliu</td>
            <td>15</td>
            <td>Backend</td>
        </tr>
    </table>

</body>
</html>
